; Cyberware.dll settings: the player's defaults. Staged only if the file does not exist yet, so your edits survive
; rebuilds (a copy that still carries test settings - bDebug=1 or a test seam - is backed up and replaced).
; Test-only settings never go here: they live in Cyberware.Test.ini in the separate MO2 mod "Cyberware - Test Config",
; which only the test profile ticks; any key that file names overrides this one.
[General]
; 1 = debug ops (debugGrant, debugReset), buy/install without a ripperdoc, every API call logged
bDebug=0
; Hotkey that shows YOUR SETUP anywhere, read only: installed chrome, stats, capacity, Customize, Settings.
; Buying, fitting, removing and upgrading happen only by talking to a ripperdoc. A Windows VK code; 0 = off;
; default 0x77 = F8. The Settings tab can change it (saved to Documents\My Games\Fallout4\F4SE\Cyberware).
; Not Insert (0x2D): it never reaches the game's input handler. Not F10: FallAway's call menu.
; (An older file with iOpenKey=<key> and no iSetupKey keeps that key for this view.)
iSetupKey=0x77
; Pause the game while the menu is open
bPauseGame=1
; 1 = the cosave and load/save callbacks take a lock against the plugin's game tasks. 0 until an in-game cycle proves it.
bStateLock=0

[Menu]
; 1 = while the ripperdoc menu is open, Esc and Tab do not also open the game's Pause menu / Pip-Boy under it
; (MenuControls' handlers are held and given back 350 ms after the menu closes; proven in game, cw-int-2 T9-T11).
; 0 turns it off; the menu still closes on Esc either way.
bEscGuard=1
; Ripperdoc conversation leaves the game running (needed for voice). Off until a cycle proves it safe with combat nearby.
bTalkUnpaused=0
; With bTalkUnpaused, the doctor gestures on each reply. Off until a capture passes.
bTalkIdles=0
; VARGA TALK (docs/VARGA-TALK.md). The ripperdoc's own dialogue branch (CW_RipperdocBlockBranch) carries DLBR flags
; 0x01 = Top-Level, the shape 129 of Fallout4.esm's 132 branches use. Which flags actually beat Fallout 34's top-level
; priority-50 branch in the live load order is the one thing only an in-game run can settle, so it is switchable here
; WITHOUT a rebuild: -1 leaves the record's own value, 1 = Top-Level, 3 = Top-Level|Blocking. Set it, relaunch, compare.
iTalkBranchFlags=-1

[Keys]
; Native ability keys (Windows VK codes, 0 = off). OS = the operating system (Sandevistan or Berserk), camo = Optical
; Camo, scan = Kiroshi scan, heal = Blood Pump, hack = upload the selected quickhack to the hostile you aim at (needs a
; cyberdeck), hack next = select the deck's next quickhack. Pick keys nothing else uses (not F1, F5, F6, F9).
; The legs (double jump, charged jump, air dash) use the game's own Jump control, no key here.
; OS default is apostrophe ' (0xDE), NOT Home: AAF (Advanced Animation Framework) uses Home for its admin/scene hotkey,
; so a Home press also started an AAF scene over the Sandevistan (P14 LOOK fail). Apostrophe is unused by the profile's
; mods and reaches the input handler like the ] and \ keys.
iKeyOS=0xDE
iKeyCamo=0x23
iKeyScan=0x21
iKeyHeal=0x22
iKeyHack=0x2E
iKeyHackNext=0xDD
; pacify = Behavioral Imprint-Synced Faceplate: every hostile human in combat within 60 m stands down (25 min cooldown)
iKeyPacify=0xDC
; Skippy only, while it is drawn: heads (Stone Cold Killer) or limbs (Puppy-Friendly). Lasts until the game closes.
iKeySkippyMode=0xDB

[Arms]
; 1 = on load, clear the equip lock from the player's weapons (not armor or other items), once per save, for saves made while arm equips were forced (they refuse the
; Pip-Boy with "You cannot unequip this item"). ON for play (the lead's ruling 2026-11-09; E4.1 and E4.2 passed in build P5).
bClearEquipLocks=1
; 1 = CP finishers: a power attack with an arm cyberware on a human at 25% HP or less (unaware, staggered or sneak
; attacked) plays the CP paired kill. Passed in game in integration cycles 1 and 2; ON for play by the lead's
; decision (2026-11-09). 0 = off.
bFinishers=1
; ---- FINISHERS 2026-11-10 (docs/FINISHER-ROWS.md): all four OFF for play until the QUALITY DIRECTOR passes the rows.
; 1 = the finisher hold lifts the victim's Health for the length of the one engine call that applies the hit, writing no
; HitData damage field, and then holds the victim on its set-piece health. 0 = the old hold, which wrote
; HitData::totalDamage and did not hold: in test build d50d6620 a 200 hp raider took 3222.1 where the field said 39.8 and
; the finisher never started. With bFinishers=1 and bHitFromDoHitMe=0 (the play default) no finisher takes this path at all.
bFinisherFloor=0
; ms over which the victim is pulled into the finisher's placement. 0 = placed in one frame, as today. A non-zero value
; below 200 is floored at 200: the QUALITY DIRECTOR's FIN-1 bar is an ease of at least 0.2 s.
iFinisherSlideMs=0
; 1 = the victim is held at its placement for the set piece, so it cannot drift out of the blade. 0 until QD passes it.
bFinisherPin=0
; 1 = log the victim's position every game frame through a finisher. Diagnostic for grading FIN-1 and FIN-5; never on for play.
bFinisherTrace=0
; 1 = log every HitData damage field around the engine call. Diagnostic, needs bDebug=1; never on for play.
bHitFieldLog=0
; 1 = the Mantis leap and the Gorilla ground slam (both re-pick the weapon animation graph). OFF for players: they
; stay out until their real versions pass the quality bar on a capture. The test profile turns them on.
bLeapRepick=0
; 1 = re-pick the weapon animation graph when the Projectile Launch System is installed, removed or restored on load, so its
; launcher clips play straight away. 0 until a test cycle proves it: a re-pick can interrupt the player.
; which launcher round mods this build OFFERS, comma separated (explosive, elec, therm, chem, incendiary, tranq).
; EMPTY = none, and empty is also the code default, so a missing key fails closed. The lead, 2026-11-10: a round ships only
; if EVERY material it swaps is graded - all seven, not three - and an ungraded round ships OFF. An unlisted round is
; dropped from the catalog, so cw::PlsRounds never enumerates it and it is never offered, bought or installed. incendiary
; wears the THERMAL materials, so neither of that pair ships without the other. Nothing is graded yet, so the value is the
; literal 'none'; 'none' and empty mean the same to the plugin, and 'none' is written out so the ledger has a real shipped
; value to record an intent against rather than an empty string, which the checker reads as undecided.
sPlsRoundsShipped=none
bPlsRepick=0
; 1 = the launcher's glow lines build up through the throw's wind-up and flash on the shot. 0 until it passes the quality bar
; on a capture.
bPlsChargeGlow=0
; 1 = while the Projectile Launch System is installed, the Pip-Boy is hidden in third person so the launcher reads as the
; forearm (as in Cyberpunk). The Pip-Boy itself still opens as normal (first person). 0 = the Pip-Boy shows in 3P as usual.
bPlsHidePipboy3P=0
; Re-equip an installed visual (PLS launcher, Gorilla knuckles) whose 3D left the player's biped while installed (QD block 26:
; the launcher gone after the first throw). 0 until a rig cycle proves it.
bVisualReattach=0
; With bVisualKeep: the Mantis housing stays on the forearm while the blades are away (the keep culls only the blades). 0 until QD passes it.
bKeepHousing=0
; 1 = in third person the Mantis blades unfold on the draw and fold on the holster (the plugin drives the fold; the 3P
; animation graph does not). 0 until it passes the quality bar on a capture.
bMantisFold3P=0
; 1 = (needs bMantisFold3P=1 and bVisualKeep=1) in third person the Mantis blades grow out of the forearm housing on the draw
; and draw back into it on the holster, instead of appearing and vanishing at full length. 0 until it passes the quality bar.
bMantisStow3P=0
; with bMantisStow3P: the holster draws the blade in from iFoldStowAtMs over iFoldStowInMs; the draw lets it out over iFoldStowOutMs
iFoldStowAtMs=900
iFoldStowInMs=300
iFoldStowOutMs=200
; 1 = Gorilla power-punch and ground-slam ragdoll knockback (tier-scaled); essential/boss/power-armor targets stagger
; instead of flying. Normal punches keep vanilla stagger. 0 = off.
bKnockback=1
; 1 = Mantis/Monowire kills sever the struck limb cleanly (not Bloody Mess). This installs a hook on the engine's
; one call to Actor::DoHitMe, so it runs on every hit; 0 = the hook is NOT installed at all (no rebuild needed).
; OFF by default until the 50+ hit stability gate passes in the test profile.
bDismember=0
; 1 = arm hits (hit sounds, finishers, Gorilla knockback, Monowire cleave, weak points, Black Mamba, Microgenerator,
; and Second Heart / Biomonitor / Countershell when the player is hit) are driven from the same DoHitMe hook, one call
; per hit the engine applies. 0 = they hang off the game's hit event, which Fallout 4 sends for only a few melee hits,
; so most of those effects never fire. Installs the hook like bDismember. OFF by default until the stability gate passes.
bHitFromDoHitMe=0
; 1 = when the player is stuck in place while walking or sprinting and the animation graph says it is moving the
; player (bAnimationDriven / bGraphDriven...), clear those flags. A diagnosis aid for the leap tests: 0 here.
bStuckUndrive=0
; 1 = with bLeapRepick=0, the Gorilla ground slam still works on the vanilla jump attack (shockwave + knockback on
; landing, no slam animation). 0 until an integration cycle proves it.
bSlamNoRepick=0
; 1 = the Mantis leap is a real launch: from a sprint attack at a target 4-12 m ahead the player leaves the ground in an
; arc (about 1 s) and strikes on landing (damage, knockdown, impact). 0 = the old short ground lunge. 0 until a cycle proves it.
bLeapLaunch=0
; With bLeapLaunch: 0 = the time in the air grows with the distance (landing 0.87-1.22 s after the swing starts).
; 250-600 = one hang time in ms for every distance, so the leap always lands 0.62 s + this after the swing starts and
; the leap animation's strike can be timed to the landing. 0 until the retimed leap clip passes the Quality Director.
iLeapHangMs=0
; Keep the arm visual worn while its arm is equipped and hide its shapes while sheathed, so the draw clip's unfold and
; the holster clip's retract are seen (anim-3). 0 until a cycle proves it. iSheathHideMs = how long the retract stays on screen.
bVisualKeep=0
iSheathHideMs=220
; First person, Mantis: the sheathe hide also waits until the blade bones show the 1P retract done (90 %), at most this many
; ms after weaponSheathe. 0 = off. Test 700 until QD passes the 1P holster (P15b T3b: full blades, then gone in one frame).
iSheathHide1PMaxMs=0

[Customize]
; 1 = with a Kiroshi installed and a Kiroshi colour chosen, the player's own eyes glow that colour (seen in third person).
; Off by default: it is switched on only for testing until proven (Cyberware.Test.ini).
bKiroshiEyeGlow=0

[HUD]
; The CyberwareHUD overlay (PrismaUI view, shipped by the HUD stream). If the file is missing, HUD messages are used instead.
bEnabled=1
sView=CyberwareHUD/index.html
; 1 = also show the HUD text lines (threats, target readout, vulnerabilities) while the overlay is up. 0 = text only as
; the fallback when the view file is missing.
bMessages=0
; HUD layout editor (drag / resize every HUD element; Settings tab > Edit HUD layout, or L in the ripperdoc menu).
; This key opens it from gameplay too, and pressed again saves and closes it. A Windows VK code; 0 = no key;
; default 0x71 = F2, and the TEST build uses the same value, so a test press proves the key players get.
; No mod in the large load orders it was checked against binds F2 (scanned 2026-11-10); its
; only other owner in docs/KEYBINDS.md is Place Everywhere's 'ground' toggle, which is workshop/build mode only,
; and the editor refuses to open while any game menu is up (WorkshopMenu included) - the same benign overlap as
; iKeyHack on Delete. It differs from the setup view key on BOTH builds (F8 play, F7 test), and from F7, which is
; now FallAway's push-to-talk on play, and from F11 (AAF's quickscene key).
; If it is the same key as the setup view's, the setup view keeps the key.
; The layout is saved to Documents\My Games\Fallout4\F4SE\Cyberware\HudLayout.json; sLayoutDir overrides that folder.
iEditKey=0x71
sLayoutDir=

[Settings]
; Where the in-menu player Settings persist (CyberwareSettings.ini, seeds NEW games; each save's
; own settings live in its cosave). Empty = Documents\My Games\Fallout4\F4SE\Cyberware — never
; under the MO2 VFS, so nothing lands in overwrite. The test build overrides this in
; Cyberware.Test.ini so test runs cannot seed play-profile new games.
sSettingsDir=

[Voice]
; 1 = the ripperdoc speaks her lines out loud with lip sync (needs the "Cyberware - Voices.esp" plugin ticked and its
; voice files). Off by default: unproven in game, so it is switched on only for testing (Cyberware.Test.ini). With it
; off, or for any line without a clip, the talk is text only.
bEnabled=0
bProbe=0
sVoices=Data\F4SE\Plugins\Cyberware\voices.json

[Smart]
; ARMORY smart guns (the separate plugin "Cyberware - Armory.esp"). 1 = with Smart Link installed and a smart gun drawn,
; hostiles near the crosshair are locked (CP's cones and timings) and your rounds curve to them. Off by default: the
; steering patches every missile-type projectile's update and is unproven in game, so it is on only in the test
; profile until an integration cycle passes it. With 0 the smart guns fire straight.
bSmartLock=0
; 1 = the Yukimura and Skippy use Cyberware 2077's first-person clips where they exist. Unproven in game, off by default.
bStageBAnims=0
; 0 = lock and log only, 1 = also hand each round its target (engine seeking), 2 = also steer the round every frame
iSteerMode=2
; 1 = once a second while a smart gun is drawn, log the aim and why each nearby actor does or does not lock. Off for play.
bDiag=0

[Armory]
; 1 = Varga also sells ARMORY gear whose Cyberpunk model is not built yet (it would show a vanilla stand-in mesh).
; Always 0 for play: nothing reaches the shop until it looks right. The test profile sets 1 to test the mechanics.
bSellUnready=0

[Paths]
sCatalog=Data\F4SE\Plugins\Cyberware\cyberware.json
sFormMap=Data\F4SE\Plugins\Cyberware\formmap.json
; ARMORY form map (written by espgen armory); missing = smart guns inert
sArmoryFormMap=Data\F4SE\Plugins\Cyberware\armory-formmap.json
sView=Cyberware/index.html

[Clinic]
; Varga's daily schedule mover (cw_clinic.cpp): crosses the clinic door unseen, between the clinic
; and the Diamond City market walk (10:00-14:00). OFF for players until promoted.
bSchedule=0
; sClinicCell=Cyberware - Clinic.esp|800
; sMarketWorldspace=Fallout4.esm|F94
; sZoneMarket=2250,1500,-1569,3.5
; sZoneShop=1800,2065,567.5,1.57
[Sandevistan]
; Experimental pose-clone afterimages. Off until in-game testing passes.
bAfterimages=0

[Sound]
; bSnd3D: positioned cues through BSAudioManager. bCues: the wired cue layer (arms, abilities, quickhacks, zoom, menu palette,
; sound/WIRING-SPEC.md). Both stay 0 here until an integration cycle has heard them; Cyberware.Test.ini turns them on.
bSnd3D=0
bCues=0
; Trim on every Cyberware cue in dB, 0 or negative only. Needs bSnd3D=1.
fMasterDb=0

[Scene]
; The ripperdoc INSTALL SCENE (docs/INSTALL-SCENE.md). bChairScene=1 seats the player in the doctor's surgical
; chair, takes the camera for at most 9 s, walks her to her mark and plays her voiced line. That is new engine
; surface (furniture entry, a held third-person camera, an input lock), so it stays 0 for players until an
; integration cycle and the Quality Director have passed a capture. Cyberware.Test.ini sets 1.
; With 0 the install still gets a beat: the 2.0 s flare + lower-third drawn by the menu, with the world visible.
bChairScene=0
; ThirdPersonState freeRotation.y as camera PITCH is unproven (only .x as yaw is, by the cam3p seam). 0 = yaw and
; zoom only, which is enough to frame the chair.
bCamPitch=0
; 0 = the menu's flat-fill flare alone at beat 6 (the baseline). 1 = also trigger the vanilla imagespace, inside
; vanilla ranges, as an A/B. Graded with frame generation and neural rendering ON (both stay on, always).
iFlare=0
; Per doctor, all optional: the code already carries Varga's clinic records as defaults, so an ini needs none of
; them. "Plugin.esp|hex" for records; shots are "yawDeg,pitchDeg,zoom" relative to the seated player's facing.
; sSeat_diamondcity=Cyberware - Clinic.esp|A4E
; sMark_diamondcity=Cyberware - Clinic.esp|A4F
; sSceneGlobal_diamondcity=Cyberware - Clinic.esp|A50
;     CW_ClinicSceneActive, built by CLINIC 2026-11-10. A GLOB the DLL only WRITES: 1 while the scene runs, 0 on its
;     end, on an abort and on every load. Her CW_ClinicStepIn package (A51, first in her list) conditions on it and
;     travels her to the surgeon mark. This is the CODE DEFAULT, so an ini needs no line for it; set it to empty to
;     go back to her being turned in place instead of walking in.
; sReadyPkgs_diamondcity=Cyberware - Clinic.esp|975,A4C
; sShotA_diamondcity=150,15,1.6
; sShotB_diamondcity=210,10,0.9
; sEntry_diamondcity=1835,2155,567.5

[Quickhacks]
; 1 = two quickhacks do what their shop text says: Reboot Optics blinds its target (for 12 s it stops fighting and
; notices nothing until it is hit) and Cyberware Malfunction staggers its target as it lands. 0 = Reboot Optics only
; lowers Perception and Cyberware Malfunction only lowers armor. 0 until a test cycle proves both.
bHackEffects=0

[Abilities]
; The screen flash when Second Heart saves you (it also plays a sound). The number is a Fallout 4 imagespace modifier:
; 0x64C27 = a short bright flash (default), 0xD3C86 = the VATS critical flash (1 s), 0x10C445 = the low-health pulse (1 s).
; 0 = no flash, sound only.
iSecondHeartImod=0x64C27
